name: Publish library to npm

# 触发：push 形如 `v0.1.3` 的 tag ⇒ 自动发布。
#
# 版本规则（AGENTS.md 同款，硬约束）：
#   tag `vX.Y.Z` == 根 package.json 的 version == packages/demo/package.json 的 version
#   一个 tag 同时发「库」与「demo 插件」两个包，**不再有 demo-v* 独立 tag**。
#
# 前置（一次，人在 npm 网页做）：包 Settings → Trusted Publisher 里
#   允许的 actions 必须勾上 `npm publish`（只勾 stage 的话这里会被拒）。
on:
  push:
    tags:
      - 'v*'
  # 补发通道：发布失败修好后不必重建 tag，直接在 Actions 页 Run 一次即可
  workflow_dispatch:

# id-token: write 是 OIDC 的硬性要求——npm 借此在 CI 内拿到短期发布凭证。
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # OIDC 发布要求 Node ≥ 22.14 / npm CLI ≥ 11.5.1，20 不满足
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Upgrade npm
        # Trusted Publishing 要求 npm CLI ≥ 11.5.1；Node 22 自带 npm 10.x，
        # 版本不够时 npm 不会走 OIDC，退化成匿名发布 ⇒ registry 回 404（假象，不是包不存在）
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: 版本一致性校验（tag / 核心 / demo 三者必须同号）
        run: |
          CORE=$(node -p "require('./package.json').version")
          DEMO=$(node -p "require('./packages/demo/package.json').version")
          echo "ref_type=$GITHUB_REF_TYPE ref_name=$GITHUB_REF_NAME core=$CORE demo=$DEMO"
          [ "$DEMO" = "$CORE" ] || { echo "::error::demo 版本 $DEMO 与核心版本 $CORE 不一致"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            [ "$TAG" = "$CORE" ] || { echo "::error::tag v$TAG 与核心版本 $CORE 不一致"; exit 1; }
          fi

      - name: Build
        # dist 随包发布且宿主安装不跑构建，CI 内重建保证产物新鲜
        run: pnpm run build

      - name: Publish
        # 不设置 NODE_AUTH_TOKEN：GitHub Actions 中 npm 自动用 OIDC 凭证；provenance 也自动生成
        run: npm publish --access public

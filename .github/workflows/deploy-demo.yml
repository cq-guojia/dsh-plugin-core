name: Deploy demo to GitHub Pages

# 只手动触发：Pages 未启用时自动跑会每次 push 都报红（configure-pages 拿不到 Pages 站点）。
# 启用方式二选一：
#   1. 仓库 Settings → Pages → Source 选 "GitHub Actions"，再手动 Run 一次本 workflow；
#   2. 直接手动 Run 一次（下面 enablement: true 会尝试自动启用，需要 token 有对应权限）。
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # 预览站消费的就是 dist/，必须先出正式产物
      - run: pnpm run build
      - run: pnpm run demo:build

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: Deploy demo to GitHub Pages

# 推到 main 自动部署预览站；也保留手动触发。
# 前置一次性操作（GitHub 安全限制，workflow 的 token 无法自动建站，必须人点）：
#   仓库 Settings → Pages → Source 选 "GitHub Actions"
# 点完后再 push / 手动 Run 即可，之后每次 push 自动更新。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # 预览站消费的就是 dist/，必须先出正式产物
      - run: pnpm run build
      - run: pnpm run demo:build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

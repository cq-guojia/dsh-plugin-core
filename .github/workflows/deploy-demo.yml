name: Deploy demo to GitHub Pages

# 推到 main 自动部署预览站；也保留手动触发。
# 首次运行靠 enablement: true 自动创建 Pages 站点；若仓库未授权自动创建，
# 则需到 仓库 Settings → Pages → Source 选 "GitHub Actions" 后，下次 push 即生效。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # 预览站消费的就是 dist/，必须先出正式产物
      - run: pnpm run build
      - run: pnpm run demo:build

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

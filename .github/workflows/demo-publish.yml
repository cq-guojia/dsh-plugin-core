name: Publish demo plugin to npm

# 发布 packages/demo（包名 `dsh-plugin-core-demo`）。
# 触发：与库共用同一个 `vX.Y.Z` tag —— 打一次 tag，两个包一起发。
# 版本必须与核心**完全一致**（规则见 AGENTS.md）；不一致时本 workflow 直接失败，不发布。
#
# 前置（一次，人在 npm 网页做）：本包有独立的 Trusted Publisher
#   （package = dsh-plugin-core-demo，仓库 = cq-guojia/dsh-plugin-core，workflow = demo-publish.yml），
#   允许的 actions 必须勾上 `npm publish`。
on:
  push:
    tags:
      - 'v*'
  # 补发通道：发布失败修好后不必重建 tag，直接在 Actions 页 Run 一次即可
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # OIDC 发布要求 Node ≥ 22.14 / npm CLI ≥ 11.5.1，20 不满足
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Upgrade npm
        # Trusted Publishing 要求 npm CLI ≥ 11.5.1；Node 22 自带 npm 10.x，
        # 版本不够时 npm 不会走 OIDC，退化成匿名发布 ⇒ registry 回 404（假象，不是包不存在）
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: 版本一致性校验（tag / 核心 / demo 三者必须同号）
        run: |
          CORE=$(node -p "require('./package.json').version")
          DEMO=$(node -p "require('./packages/demo/package.json').version")
          echo "ref_type=$GITHUB_REF_TYPE ref_name=$GITHUB_REF_NAME core=$CORE demo=$DEMO"
          [ "$DEMO" = "$CORE" ] || { echo "::error::demo 版本 $DEMO 与核心版本 $CORE 不一致"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            [ "$TAG" = "$CORE" ] || { echo "::error::tag v$TAG 与核心版本 $CORE 不一致"; exit 1; }
          fi

      - name: Build library
        # demo 把库的产物打进自己的 bundle
        run: pnpm run build

      - name: Build demo plugin bundle
        run: node packages/demo/build.mjs

      - name: Publish
        working-directory: packages/demo
        run: npm publish --access public

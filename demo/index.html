<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dsh-plugin-core 组件预览</title>
    <style>
      /* 预览站自己的骨架样式（与库样式无关；库里没有 body reset，这里给 demo 页面用） */
      html, body, #root { height: 100%; margin: 0; }
      body {
        font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        background: var(--page-bg, #f7f8fa);
        color: var(--page-fg, #1d2129);
      }
      body[data-ds-dark-theme] { --page-bg: #17171a; --page-fg: #f5f5f5; }
      * { box-sizing: border-box; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
